<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Instrument Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ffe4ec 0%, #f8bbd0 100%);
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            min-height: 100vh;
            padding-top: 84px;
            padding-bottom: 40px;
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #f48fb1;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ad1457;
            font-weight: 600;
        }
        .navbar-custom .nav-link.active,
        .navbar-custom .nav-link:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border-radius: 10px;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 3px solid #f48fb1;
            box-shadow: 0 15px 35px rgba(236, 64, 122, 0.18);
            border-radius: 22px;
            max-width: 580px;
            width: 100%;
            margin: 0 auto;
            padding: 32px;
        }
        .header-box {
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 24px;
            box-shadow: 0 6px 15px rgba(236, 64, 122, 0.25);
        }
        .form-control {
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: #ec407a;
            box-shadow: 0 0 0 0.25rem rgba(236, 64, 122, 0.2);
        }
        .btn-custom {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 12px;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
        }
        .result-panel {
            background-color: #fff9fb;
            border: 2px dashed #f48fb1;
            border-radius: 16px;
            padding: 22px;
            margin-top: 24px;
            text-align: left;
        }
        .result-title {
            color: #ec407a;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: 2px solid #fce4ec;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .detail-row {
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #f48fb1;
        }
        .detail-row:last-child {
            margin-bottom: 0;
        }
        .detail-label {
            color: #ad1457;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            display: block;
        }
        .detail-value {
            color: #333333;
            font-weight: 600;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <!-- Navigation bar  -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Showcase 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#showcaseNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="showcaseNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">Homepage</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="skillstest.html">Element Checker</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="drill2.html">School Club Members</a></li>
                    <li class="nav-item"><a class="nav-link active px-3" href="meetme.html">Meet the Creator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container text-center">
        <div class="main-card">
            <div class="header-box text-center">
                <h2 class="mb-1 fw-bold">Weather Instruments</h2>
                <small class="text-white-50">Skills Test • Element Checker</small>
            </div>

            <div class="mb-3 text-start">
                <label for="weather_instruments" class="form-label fw-bold text-secondary">Instrument Name</label>
                <input type="text" id="weather_instruments" class="form-control bg-white" placeholder="e.g., Thermometer, Barometer, Rain Gauge..." autocomplete="off">
            </div>

            <button py-click="Search_Element" class="btn btn-custom w-100 shadow-sm">Check Details</button>

            <!-- Dictionary -->
            <div class="result-panel shadow-sm">
                <h4 class="result-title">Search Results</h4>

                <div class="detail-row">
                    <span class="detail-label">Instrument</span>
                    <span id="instruments" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Measures</span>
                    <span id="measures" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Unit of Measurement</span>
                    <span id="unit-of-measurement" class="detail-value">-</span>
                </div>

                <div class="detail-row">
                    <span class="detail-label">Purpose</span>
                    <span id="purpose" class="detail-value">-</span>
                </div>
            </div>
        </div>
    </div>

    <script type="py" src="main.py"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
