<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Membership Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ffe4ec 0%, #f8bbd0 100%);
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            min-height: 100vh;
            padding-top: 84px;
            padding-bottom: 40px;
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #f48fb1;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ad1457;
            font-weight: 600;
        }
        .navbar-custom .nav-link.active,
        .navbar-custom .nav-link:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border-radius: 10px;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 3px solid #f48fb1;
            box-shadow: 0 15px 35px rgba(236, 64, 122, 0.18);
            border-radius: 22px;
            padding: 32px;
        }
        .header-box {
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 24px;
            box-shadow: 0 6px 15px rgba(236, 64, 122, 0.25);
        }
        .form-control {
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #ec407a;
            box-shadow: 0 0 0 0.25rem rgba(236, 64, 122, 0.2);
        }
        .btn-custom {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            padding: 12px;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Showcase 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#showcaseNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="showcaseNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link active px-3" href="index.html">Homepage</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="element-checker.html">Element Checker</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="club-members.html">School Club Members</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="meet-the-creator.html">Meet the Creator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="main-card">
                    <div class="header-box text-center">
                        <h2 class="mb-1 fw-bold">ICT Club Portal</h2>
                        <small class="text-white-50">Seatwork 1 • Club Member Checker</small>
                    </div>

                    <div class="mb-3">
                        <label for="first-name" class="form-label fw-semibold">First Name</label>
                        <input type="text" id="first-name" class="form-control" placeholder="Enter first name">
                    </div>

                    <div class="mb-3">
                        <label for="last-name" class="form-label fw-semibold">Last Name</label>
                        <input type="text" id="last-name" class="form-control" placeholder="Enter last name">
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button py-click="check_membership" class="btn btn-custom btn-lg">Check Status</button>
                    </div>

                    <!-- Membership status -->
                    <div class="mt-4">
                        <div id="result" class="p-3 text-center rounded fw-medium"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
