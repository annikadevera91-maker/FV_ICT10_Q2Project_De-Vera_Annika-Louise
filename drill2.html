<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #ffe4ec 0%, #f8bbd0 100%);
            font-family: 'Poppins', sans-serif;
            color: #4a4a4a;
            min-height: 100vh;
            padding-top: 84px;
            padding-bottom: 40px;
        }
        .navbar-custom {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #f48fb1;
        }
        .navbar-custom .navbar-brand,
        .navbar-custom .nav-link {
            color: #ad1457;
            font-weight: 600;
        }
        .navbar-custom .nav-link.active,
        .navbar-custom .nav-link:hover {
            color: #ffffff;
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border-radius: 10px;
        }
        .main-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border: 3px solid #f48fb1;
            box-shadow: 0 15px 35px rgba(236, 64, 122, 0.18);
            border-radius: 22px;
            padding: 32px;
        }
        .header-box {
            background: linear-gradient(135deg, #f06292, #ec407a);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 24px;
            box-shadow: 0 6px 15px rgba(236, 64, 122, 0.25);
        }
        .form-control {
            border: 2px solid #f8bbd0;
            border-radius: 12px;
            padding: 12px 16px;
        }
        .form-control:focus {
            border-color: #ec407a;
            box-shadow: 0 0 0 0.25rem rgba(236, 64, 122, 0.2);
        }
        .btn-custom {
            background: linear-gradient(135deg, #f48fb1, #ec407a);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            padding: 12px;
        }
        .btn-custom:hover {
            background: linear-gradient(135deg, #ec407a, #d81b60);
            color: white;
        }
    </style>
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-custom fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Student Showcase 2026</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#showcaseNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="showcaseNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item"><a class="nav-link px-3" href="index.html">Homepage</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="skillstest.html">Element Checker</a></li>
                    <li class="nav-item"><a class="nav-link px-3" href="drill2.html">School Club Members</a></li>
                    <li class="nav-item"><a class="nav-link active px-3" href="meetme.html">Meet the Creator</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="main-card">
                    <div class="header-box text-center">
                        <h2 class="mb-1 fw-bold">ICT Club Membership Portal</h2>
                        <small class="text-white-50">Drill 2 • School Club Members Roster</small>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="first-name" class="form-label fw-semibold">First Name</label>
                            <input type="text" id="first-name" class="form-control" placeholder="Enter first name">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="last-name" class="form-label fw-semibold">Last Name</label>
                            <input type="text" id="last-name" class="form-control" placeholder="Enter last name">
                        </div>
                    </div>

                    <!-- Adds input name to the combined member set -->
                    <div class="d-grid mt-3">
                        <button py-click="add_new_member" class="btn btn-custom btn-lg">Add Member & Update Roster</button>
                    </div>

                    <!-- Displays total count and sorted roster -->
                    <div class="mt-4">
                        <div id="result" class="p-4 rounded border bg-white">
                            <em class="text-muted">Enter a name above and click the button to show the full club list.</em>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="py">
from pyscript import document

# Sets per grade level
grade_7_members = {"Gavin Ruiz", "Edrian Correa", "Philip Ponce"}
grade_8_members = {"Julian Anaque", "Andrik David", "Annika De Vera"}
grade_9_members = {"Eliana Daet", "Zecca Zeppola", "Tic Toc Tortora"}
grade_10_members = {"Ratio Randall", "Coccinella Cotoletta", "Farfallina Farfallona"}

def add_new_member(event):
    fname = document.querySelector("#first-name").value.strip()
    lname = document.querySelector("#last-name").value.strip()
    
    new_member_set = {f"{fname} {lname}".title()}

    # Merge all sets with union operator 
    master_club_set = grade_7_members | grade_8_members | grade_9_members | grade_10_members | new_member_set
    master_club_set = master_club_set - {" "}

    formatted_members_list = "<br>".join(sorted(master_club_set))
    total_members_count = len(master_club_set)

    output_html = f"""
    <h5 class="fw-bold text-success mb-3">Master Club Roster Updated</h5>
    <p class="mb-2"><strong>Total Number of Members:</strong> <span class="badge bg-primary fs-6">{total_members_count}</span></p>
    <div class="mt-3">
        <strong>Full List of Members:</strong>
        <div class="p-3 mt-2 bg-light rounded border font-monospace text-dark">
            {formatted_members_list}
        </div>
    </div>
    """

    document.querySelector("#result").innerHTML = output_html
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
